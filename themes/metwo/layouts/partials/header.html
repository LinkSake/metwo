<header>
  <nav>
    <ul>
      {{/* Left-side main nav links */}}
      {{ $title   := lower .Title }}
      {{ $section := lower .Section }}
      {{ range .Site.Menus.main }}
        {{ $name := lower .Name }}
        <li class="{{ if eq $name $title }}hide-on-mobile{{ else if eq $section $name }}current{{ else if eq $title (pluralize $name) }}current{{ end }}">
          <a href="{{ absLangURL .URL }}">~/{{ lower .Name }}</a>
        </li>
      {{ end }}

    </ul>
  </nav>
</header>
