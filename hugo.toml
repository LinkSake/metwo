baseurl = "https://luisangel.me/"
baseURL = "https://luisangel.me/"
enableEmoji = true
enableRobotsTXT = true
# lastmod from each file's last commit (sitemap, structured data, IndexNow change detection)
enableGitInfo = true
footnotereturnlinkcontents = "↩"
ignoreFiles = ["\\.Rmd$", "_files$", "_cache$"]
locale = "en-us"
theme = "metwo"
title = "luis ángel ortega"
copyright = "2026 Luis Ángel Ortega Holguin All rights reserved"

[markup.goldmark.renderer]
unsafe = true

[markup.highlight]
anchorLineNos = false
codeFences = true
guessSyntax = false
lineAnchors = ""
lineNoStart = 1
lineNos = false
lineNumbersInTable = true
noClasses = true
style = "catppuccin-frappe"
tabWidth = 4

[params]
# Default share image for Open Graph / Twitter cards when a page has no `images`.
images = ["/images/index/avatar.jpeg"]

[params.author]
name  = "Luis Ángel Ortega"
email = "hey@luisangel.me"

[params.socials]
email       = "hey@luisangel.me"
bluesky     = "https://bsky.app/profile/luisangel.me"
instagram   = "https://instagram.com/linksake"
substack_en = "https://linksake.substack.com"
substack_es = "https://luisangelortega.substack.com"

[permalinks]
post = "/post/:year/:month/:day/:slug/"

# llms.txt: a plain-text summary of the site for LLM-based search (https://llmstxt.org)
[outputFormats.llms]
mediaType   = "text/plain"
baseName    = "llms"
isPlainText = true
notAlternative = true

[outputs]
home = ["HTML", "RSS", "llms"]

[languages]
[languages.en]
contentDir = 'content/en'
disabled = false
locale = 'en-US'
direction = 'ltr'
label = 'English'
weight = 0
[languages.en.params]
description = "Luis Ángel Ortega is a Mexican writer, poet and software developer from Chihuahua, Mexico, winner of the 2026 Premio Estatal de Literatura Joven for his short story collection El oficio de las cosas. Short stories, poems, notes and projects."
seoTitle = "Luis Ángel Ortega — writer, poet and developer from Chihuahua, Mexico"
footer = "Luis Ángel Ortega © 2026"
